name: Validate skill catalog

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "catalog/**"
      - "scripts/update_catalog.py"
      - "CATALOG.md"
      - "README.md"
      - ".github/workflows/catalog.yml"
  push:
    paths:
      - "skills/**/SKILL.md"
      - "catalog/**"
      - "scripts/update_catalog.py"
      - "CATALOG.md"
      - "README.md"
      - ".github/workflows/catalog.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate taxonomy and generated catalogs
        run: python scripts/update_catalog.py --check
