name: Validate skill catalog

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "catalog/**"
      - "scripts/update_catalog.py"
      - "scripts/check_install_links.py"
      - "scripts/test_check_install_links.py"
      - "install.ps1"
      - "install.sh"
      - "CATALOG.md"
      - "README.md"
      - "README.en.md"
      - "SKILLS.md"
      - "SKILLS.en.md"
      - ".github/workflows/catalog.yml"
  push:
    paths:
      - "skills/**/SKILL.md"
      - "catalog/**"
      - "scripts/update_catalog.py"
      - "scripts/check_install_links.py"
      - "scripts/test_check_install_links.py"
      - "install.ps1"
      - "install.sh"
      - "CATALOG.md"
      - "README.md"
      - "README.en.md"
      - "SKILLS.md"
      - "SKILLS.en.md"
      - ".github/workflows/catalog.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate taxonomy and generated catalogs
        run: python scripts/update_catalog.py --check
      # Install entries live in home directories CI cannot see; the checker itself is tested
      # on symlinks here and on junctions locally.
      - name: Test the install entry checker
        run: python scripts/test_check_install_links.py
      - name: Syntax-check install.sh
        run: bash -n install.sh
