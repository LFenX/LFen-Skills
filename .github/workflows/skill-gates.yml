name: Skill gates

on:
  pull_request:
    paths:
      - "run-web-product-workflow/**"
      - ".github/workflows/skill-gates.yml"
  push:
    paths:
      - "run-web-product-workflow/**"
      - ".github/workflows/skill-gates.yml"

jobs:
  run-web-product-workflow:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r run-web-product-workflow/requirements.txt

      # self_test.py resolves a governed project root; a bare directory is
      # sufficient and also proves the consumer bootstrap path works from nothing.
      - name: Bootstrap a governed project root
        run: mkdir -p .project-governance

      - name: Gate 1 - skill self test
        run: python run-web-product-workflow/scripts/self_test.py --project-root .

      - name: Gate 2 - protected retrieval contracts
        run: python run-web-product-workflow/scripts/audit_norm_retrieval.py --validate-only --runtime-only
