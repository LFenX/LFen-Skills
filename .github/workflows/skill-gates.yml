name: Skill gates

on:
  pull_request:
    paths:
      - "skills/product-engineering/run-web-product-workflow/**"
      - ".github/workflows/skill-gates.yml"
  # No paths filter here on purpose: a tag push often carries no path diff, and
  # filtering it out would leave release tags unverified. The gates take ~2 min.
  push:
    branches: ["**"]
    tags: ["rwpw-v*"]

jobs:
  gates:
    runs-on: ubuntu-latest
    # The Skill claims a consumer can verify their own copy with self_test.py.
    # That claim is only worth anything if it is checked on more than one
    # interpreter, so every supported version runs the full gate set.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r skills/product-engineering/run-web-product-workflow/requirements.txt

      # self_test.py resolves a governed project root; a bare directory is
      # sufficient and also proves the consumer bootstrap path works from nothing.
      - name: Bootstrap a governed project root
        run: mkdir -p .project-governance

      - name: Gate 1 - skill self test
        run: python skills/product-engineering/run-web-product-workflow/scripts/self_test.py --project-root .

      - name: Gate 2 - protected retrieval contracts
        run: python skills/product-engineering/run-web-product-workflow/scripts/audit_norm_retrieval.py --validate-only --runtime-only

      - name: Gate 3 - runtime norm consistency
        run: python skills/product-engineering/run-web-product-workflow/scripts/audit_norm_consistency.py --project-root . --runtime-only

  # A tag is only a label until something checks what it points at. This job
  # makes the published trust root machine-verified: it runs only for rwpw-v*
  # tags, depends on every gate passing, and refuses a tag whose name does not
  # match the version the Skill declares.
  release:
    if: startsWith(github.ref, 'refs/tags/rwpw-v')
    needs: gates
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the declared Skill version
        run: python .github/scripts/check_release_tag.py "${GITHUB_REF_NAME}"
